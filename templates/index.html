{% extends "base.html" %}

{% block content %}
    <h1>Lista de Usuários</h1>
    
    <ul>
        {% for user in users %}
            <li>
                <strong>{{ user.name }}</strong> - {{ user.role }}
            </li>
        {% else %}
            <li>Nenhum usuário encontrado.</li>
        {% endfor %}
    </ul>
    <p>Total: {{ format_currency(1500.50) }}</p>
{% endblock %}
